spring:
  application:
    name: agent-backend
#  datasource:
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql://localhost:3306/ai_code
#    username: root
#    password: LZNlzn123.
#
#      # Redis 配置
  data:
    redis:
      database: ${spring.data.redis.database}
      host: ${spring.data.redis.host}
      port: ${spring.data.redis.port}
      timeout: ${spring.data.redis.timeout}
      ttl: ${spring.data.redis.ttl}
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-v4-flash
    alibaba:
      memory:
        chat:
          type: redis

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  session:
    timeout: 2592000
  profiles:
    active: dev

  mail:
    host: smtp.qq.com
    port: 587
    username: ${QQ_MAIL_USERNAME:}
    password: ${QQ_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

logging:
  level:
    org.springframework.ai: debug

server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        # session过期时间30天
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.limou.agent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
cos:
  client:
    region: ${cos.client.region}
    secretId: ${cos.client.secretId}
    secretKey: ${cos.client.secretKey}
    host: ${cos.client.host}
    bucket: ${cos.client.bucket}
