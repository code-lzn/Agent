# Pexels 图片搜索配置
pexels:
  api-key: ${pexels.api-key}
# 阿里云 DashScope 配置
dashscope:
  api-key: ${dashscope.api-key}
  image-model: ${dashscope.image-model}

# 支付宝沙箱支付配置 https://open.alipay.com/develop/sandbox/app
alipay:
  enabled: true
  # 沙箱应用ID - 您的APPID，收款账号既是你的APPID对应支付宝账号
  app_id: 9021000162681551
  # 商户私钥，PKCS8格式RSA2私钥
  app_private_key: 
  # 支付宝公钥 -【秘钥填写】后提供给你的支付宝公钥
  alipay_public_key: 
  # 服务器异步通知页面路径 - natapp 内网穿透
  notify_url: http://lbljh.nat100.top/api/payment/alipay/notify
  # 页面跳转同步通知页面路径
  return_url: https://gaga.plus
  # 沙箱网关地址
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  sign_type: RSA2
  charset: utf-8
  format: json


