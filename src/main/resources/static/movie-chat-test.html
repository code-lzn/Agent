<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电影票 Agent 流式测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; padding: 20px;
}
.container {
  width: 100%; max-width: 700px;
  background: #16213e; border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
  display: flex; flex-direction: column; height: 85vh;
}
.header {
  padding: 16px 20px; border-bottom: 1px solid #0f3460;
  display: flex; align-items: center; gap: 12px;
}
.header .dot { width: 10px; height: 10px; border-radius: 50%; background: #00ff88; }
.header h1 { color: #e0e0e0; font-size: 18px; font-weight: 600; }
.header span { color: #888; font-size: 13px; margin-left: auto; }
.config-bar {
  padding: 12px 20px; background: #0f3460;
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
.config-bar label { color: #aaa; font-size: 12px; white-space: nowrap; }
.config-bar input {
  padding: 6px 10px; border: 1px solid #1a508b; border-radius: 6px;
  background: #1a1a2e; color: #e0e0e0; font-size: 13px; outline: none;
  flex: 1; min-width: 100px;
}
.config-bar input:focus { border-color: #00ff88; }
.chat-area {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 16px;
}
.msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; word-break: break-word; }
.msg.user { align-self: flex-end; background: #0f3460; color: #e0e0e0; }
.msg.ai { align-self: flex-start; background: #1a1a2e; color: #d0d0d0; border: 1px solid #2a2a4a; }
.msg .label { font-size: 11px; color: #888; margin-bottom: 4px; }
.tool-hint { color: #888; font-size: 12px; padding: 2px 0; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
.input-area {
  padding: 16px 20px; border-top: 1px solid #0f3460;
  display: flex; gap: 10px;
}
.input-area textarea {
  flex: 1; padding: 10px 14px; border: 1px solid #1a508b; border-radius: 10px;
  background: #1a1a2e; color: #e0e0e0; font-size: 14px; resize: none;
  outline: none; min-height: 44px; max-height: 120px;
}
.input-area textarea:focus { border-color: #00ff88; }
.input-area button {
  padding: 10px 24px; border: none; border-radius: 10px;
  background: #00ff88; color: #1a1a2e; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity .2s;
}
.input-area button:hover { opacity: .85; }
.input-area button:disabled { opacity: .4; cursor: not-allowed; }
.reset-btn {
  padding: 4px 12px; border: 1px solid #1a508b; border-radius: 6px;
  background: transparent; color: #aaa; font-size: 12px; cursor: pointer;
}
.reset-btn:hover { border-color: #e74c3c; color: #e74c3c; }
.typing { color: #00ff88; font-size: 12px; padding: 4px 8px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="dot"></div>
    <h1>Movie Agent</h1>
    <span>/chat-stream SSE</span>
  </div>

  <div class="config-bar">
    <label>Conversation ID:</label>
    <input id="convId" value="test-session-1" style="flex:0.5">
    <label>User ID:</label>
    <input id="userId" type="number" value="1" style="flex:0.3">
    <select id="mode" style="padding:2px 6px;border:1px solid #1a508b;border-radius:6px;background:#1a1a2e;color:#e0e0e0;font-size:12px;">
      <option value="smart" selected>Smart</option>
      <option value="react">ReAct</option>
      <option value="graph">Graph</option>
    </select>
    <button class="reset-btn" onclick="resetSession()">重置</button>
    <span style="color:#666;font-size:11px;margin-left:auto">端口: 8123</span>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="msg ai">
      <div class="label">AI</div>
      你好，我是电影票助手！试试说"帮我搜一下最近有什么电影"或者"我要买票"
    </div>
  </div>

  <div class="input-area">
    <textarea id="userInput" placeholder="输入消息，按 Enter 发送..." rows="1"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
</div>

<script>
const BASE = 'http://localhost:8123/api';

function $(id) { return document.getElementById(id); }

function appendMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="label">' + (role === 'user' ? '你' : 'AI') + '</div>' + text;
  $('chatArea').appendChild(div);
  $('chatArea').scrollTop = $('chatArea').scrollHeight;
  return div;
}

function setLoading(loading) {
  $('sendBtn').disabled = loading;
  $('userInput').disabled = loading;
}

function send() {
  const message = $('userInput').value.trim();
  if (!message) return;

  appendMsg('user', message);
  $('userInput').value = '';
  setLoading(true);

  const aiDiv = appendMsg('ai', '<span class="typing">▍思考中...</span>');
  let fullText = '';
  let toolHintEl = null;

  const conversationId = $('convId').value || 'test-session-1';
  const userId = $('userId').value || '1';
  const params = new URLSearchParams({ message, conversationId, userId });
  const mode = ($('mode') && $('mode').value) || 'smart';
const pathMap = { smart: '/movie-agent/smart-stream', react: '/movie-agent/chat-stream', graph: '/movie-graph/chat-stream' };
const url = BASE + (pathMap[mode] || pathMap.smart) + '?' + params;

  const eventSource = new EventSource(url);

  eventSource.addEventListener('message', (e) => {
    try {
      const parsed = JSON.parse(e.data);
      // 工具调用事件：显示为临时状态提示，不混入对话文本
      if (parsed.type === 'tool_start') {
        if (!toolHintEl) {
          toolHintEl = document.createElement('div');
          toolHintEl.className = 'tool-hint';
          aiDiv.appendChild(toolHintEl);
        }
        toolHintEl.textContent = '⏳ ' + parsed.d;
        $('chatArea').scrollTop = $('chatArea').scrollHeight;
        return;
      }
      // 正常文本：先移除工具提示
      if (toolHintEl) { toolHintEl.remove(); toolHintEl = null; }
      const chunk = parsed.d || '';
      fullText += chunk;
      aiDiv.innerHTML = '<div class="label">AI</div>' + escapeHtml(fullText) + '<span class="typing">▍</span>';
      $('chatArea').scrollTop = $('chatArea').scrollHeight;
    } catch (err) {
      // ignore parse errors
    }
  });

  eventSource.addEventListener('done', () => {
    if (toolHintEl) { toolHintEl.remove(); toolHintEl = null; }
    aiDiv.innerHTML = '<div class="label">AI</div>' + escapeHtml(fullText);
    eventSource.close();
    setLoading(false);
  });

  eventSource.addEventListener('error', (e) => {
    if (toolHintEl) { toolHintEl.remove(); toolHintEl = null; }
    if (fullText) {
      aiDiv.innerHTML = '<div class="label">AI</div>' + escapeHtml(fullText) + '\n\n<span style="color:#e74c3c">[连接断开]</span>';
    } else {
      aiDiv.innerHTML = '<div class="label">AI</div><span style="color:#e74c3c">请求失败，请检查服务是否启动</span>';
    }
    eventSource.close();
    setLoading(false);
  });
}

async function resetSession() {
  const conversationId = $('convId').value;
  try {
    await fetch(BASE + '/movie-agent/reset?conversationId=' + conversationId, { method: 'POST' });
    $('chatArea').innerHTML = '';
    appendMsg('ai', '会话已重置，开始新对话吧～');
  } catch (e) {
    alert('重置失败: ' + e.message);
  }
}

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}
</script>

</body>
</html>
